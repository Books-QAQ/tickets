services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_CONNECTION=mysql
      - DB_USERNAME=root
      - DB_PASSWORD=020218
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=tickets
      - MIGRATION_URL=file://internal/db/migration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
    depends_on:
      - mysql
      - redis
      - rabbitmq
    restart: always
    command: [ "/app/main" ]
  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=020218
      - MYSQL_DATABASE=tickets
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
volumes:
  mysql_data:
  redis_data:
