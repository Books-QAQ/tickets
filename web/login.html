<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>票务系统 | 登录</title>
  <link rel="stylesheet" href="/assets/css/base.css?v=20260818-3">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-badge">TM</span>
        <span>智慧客运票务系统</span>
      </a>
      <div class="topbar-right">
        <nav class="nav-links" aria-label="主导航">
          <a href="/">首页</a>
          <a href="/booking">购票</a>
          <a href="/profile">个人中心</a>
        </nav>
        <a class="is-primary" href="/login">登录</a>
        <a class="nav-solid" href="/register">注册</a>
      </div>
    </div>
  </header>

  <main class="shell shell--center">
    <section class="card card--narrow">
      <div class="eyebrow">登录</div>
      <h1>账号登录</h1>
      <p class="lead">输入用户名和密码后，将自动跳转到购票页面。</p>
      <form id="login-form">
        <label>
          用户名
          <input id="login-username" name="username" placeholder="请输入用户名" required>
        </label>
        <label>
          密码
          <input id="login-password" name="password" type="password" placeholder="请输入密码" required>
        </label>
        <button class="btn-primary" type="submit">登录并前往购票</button>
      </form>
      <div class="switch-link">还没有账号？<a href="/register">前往注册</a></div>
      <div class="status" id="login-status">请输入账号信息后登录。</div>
    </section>
  </main>

  <script>
    const TOKEN_KEY = "ticket_master_access_token";
    const form = document.getElementById("login-form");
    const statusBox = document.getElementById("login-status");
    const token = localStorage.getItem(TOKEN_KEY);

    function setStatus(message, tone = "") {
      statusBox.textContent = message;
      statusBox.dataset.tone = tone;
    }

    async function request(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const raw = await response.text();
      let data = null;

      if (raw) {
        try {
          data = JSON.parse(raw);
        } catch (error) {
          data = raw;
        }
      }

      if (!response.ok) {
        const message = typeof data === "object" && data && data.error ? data.error : `${response.status} ${response.statusText}`;
        throw new Error(message);
      }

      return data;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const formData = new FormData(form);

      try {
        const data = await request("/login", {
          method: "POST",
          body: JSON.stringify({
            username: formData.get("username"),
            password: formData.get("password")
          })
        });

        const response = data && data.response ? data.response : null;
        if (!response || !response.access_token) {
          throw new Error("服务端未返回访问令牌");
        }

        localStorage.setItem(TOKEN_KEY, response.access_token);
        setStatus(`用户 ${response.user.username} 登录成功，正在跳转到购票页。`, "success");
        setTimeout(() => {
          window.location.assign("/booking");
        }, 350);
      } catch (error) {
        setStatus(`登录失败：${error.message}`, "error");
      }
    });

    if (token) {
      setStatus("检测到当前浏览器已存在登录态，你可以直接重新登录，或前往购票页。", "success");
    }
  </script>
  <script src="/assets/js/cs.js" defer></script>
</body>
</html>
