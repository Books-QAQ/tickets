<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>票务系统 | 个人中心</title>
  <style>
    :root {
      --page-bg: #f6efe3;
      --surface: rgba(255, 250, 242, 0.88);
      --text: #1d2733;
      --muted: #617180;
      --line: rgba(29, 39, 51, 0.12);
      --primary: #0c7c73;
      --primary-deep: #085952;
      --accent: #d96f32;
      --danger: #b7463e;
      --success: #2d7a47;
      --shadow: 0 20px 48px rgba(33, 40, 49, 0.12);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --nav-height: 78px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(217, 111, 50, 0.18), transparent 26%),
        radial-gradient(circle at top right, rgba(12, 124, 115, 0.18), transparent 22%),
        linear-gradient(180deg, #fbf6ef 0%, #f2e7d5 52%, #f6efe3 100%);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      width: 100%;
      border-bottom: 1px solid rgba(255, 255, 255, 0.46);
      background: rgba(16, 32, 39, 0.84);
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(20, 32, 39, 0.14);
    }

    .topbar-inner {
      width: min(1200px, calc(100% - 28px));
      min-height: var(--nav-height);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #f9f5ee;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #f9f5ee;
      background: linear-gradient(135deg, #0c7c73, #d96f32);
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }

    .nav-links a {
      padding: 11px 16px;
      border-radius: 999px;
      color: rgba(249, 245, 238, 0.92);
      font-size: 0.96rem;
      font-weight: 700;
      transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: white;
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-1px);
    }

    .nav-links a.is-primary {
      color: white;
      background: linear-gradient(135deg, #0c7c73, #0a635c);
    }

    .shell {
      width: min(1200px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .hero,
    .card {
      border-radius: var(--radius-xl);
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .hero {
      padding: 34px;
      background:
        linear-gradient(140deg, rgba(255, 251, 246, 0.95), rgba(255, 243, 226, 0.82)),
        linear-gradient(135deg, rgba(12, 124, 115, 0.14), rgba(217, 111, 50, 0.1));
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--primary-deep);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: rgba(12, 124, 115, 0.1);
    }

    h1,
    h2,
    h3 {
      margin: 0;
      font-family: "STZhongsong", "Microsoft YaHei", serif;
      letter-spacing: -0.03em;
    }

    h1 {
      margin-top: 18px;
      max-width: 760px;
      font-size: clamp(2.3rem, 4vw, 4.2rem);
      line-height: 1;
    }

    .hero p,
    .lead {
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.72;
    }

    .hero-actions,
    .tab-bar,
    .summary-grid,
    .meta-list,
    .ticket-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .hero-actions {
      margin-top: 22px;
    }

    .hero-actions button,
    .tab-button,
    .ticket-actions button {
      border: 0;
      cursor: pointer;
      border-radius: 999px;
      padding: 13px 20px;
      font-weight: 800;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .hero-actions button:hover,
    .tab-button:hover,
    .ticket-actions button:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, #0c7c73, #0a635c);
    }

    .btn-ghost {
      color: var(--primary-deep);
      background: rgba(12, 124, 115, 0.1);
    }

    .btn-danger {
      color: white;
      background: linear-gradient(135deg, #b7463e, #923a35);
    }

    .layout {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 18px;
      margin-top: 22px;
    }

    .card {
      grid-column: span 12;
      padding: 24px;
    }

    .span-4 {
      grid-column: span 4;
    }

    .span-8 {
      grid-column: span 8;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-top: 18px;
    }

    .summary-item,
    .ticket-card {
      padding: 18px;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(29, 39, 51, 0.08);
    }

    .summary-item strong {
      display: block;
      margin-bottom: 8px;
      font-size: 1.3rem;
    }

    .summary-item span,
    .meta-list,
    .status,
    .empty,
    .ticket-card p {
      color: var(--muted);
      line-height: 1.68;
    }

    .profile-box {
      display: grid;
      gap: 14px;
    }

    .profile-box strong {
      font-size: 1.14rem;
    }

    .meta-list span {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(12, 124, 115, 0.08);
      color: var(--primary-deep);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .status,
    .empty {
      padding: 16px 18px;
      border-radius: var(--radius-lg);
      border: 1px dashed rgba(29, 39, 51, 0.16);
      background: rgba(255, 255, 255, 0.74);
      white-space: pre-wrap;
    }

    .status[data-tone="error"] {
      color: var(--danger);
      border-color: rgba(183, 70, 62, 0.28);
      background: rgba(183, 70, 62, 0.08);
    }

    .status[data-tone="success"] {
      color: var(--success);
      border-color: rgba(45, 122, 71, 0.24);
      background: rgba(45, 122, 71, 0.08);
    }

    .tab-bar {
      margin-top: 10px;
      margin-bottom: 18px;
    }

    .tab-button {
      color: var(--primary-deep);
      background: rgba(12, 124, 115, 0.08);
    }

    .tab-button.is-active {
      color: white;
      background: linear-gradient(135deg, #0c7c73, #0a635c);
      box-shadow: 0 12px 24px rgba(12, 124, 115, 0.22);
    }

    .ticket-list {
      display: grid;
      gap: 12px;
    }

    .ticket-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(12, 124, 115, 0.1);
      color: var(--primary-deep);
      font-size: 0.86rem;
      font-weight: 800;
      white-space: nowrap;
    }

    @media (max-width: 980px) {
      .span-4,
      .span-8 {
        grid-column: span 12;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      .topbar-inner,
      .shell {
        width: min(100% - 18px, 1200px);
      }

      .topbar-inner {
        padding: 12px 0;
        align-items: flex-start;
        flex-direction: column;
      }

      .nav-links {
        justify-content: flex-start;
      }

      .hero,
      .card {
        padding: 22px;
      }

      .ticket-top {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-badge">TM</span>
        <span>智慧客运票务系统</span>
      </a>
      <nav class="nav-links" aria-label="主导航">
        <a href="/">首页</a>
        <a href="/booking">购票</a>
        <a class="is-primary" href="/profile">个人中心</a>
        <a href="/login">登录</a>
        <a href="/register">注册</a>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section class="hero">
      <div class="eyebrow">个人中心</div>
      <h1>统一查看购票历史、待出行与待付款记录</h1>
      <p>这个页面将用户信息和票据记录集中展示，并通过标签页方式区分不同状态的订单，便于你演示“分页面”的个人中心结构。</p>
      <div class="hero-actions">
        <button class="btn-ghost" id="refresh-button" type="button">刷新数据</button>
        <button class="btn-primary" id="go-booking-button" type="button">继续购票</button>
        <button class="btn-danger" id="logout-button" type="button">退出登录</button>
      </div>
      <div class="status" id="profile-status">正在加载个人资料与票据数据。</div>
    </section>

    <section class="layout">
      <article class="card span-4">
        <h2>账户信息</h2>
        <p class="lead">当前登录账号的基础资料会显示在这里。</p>
        <div class="profile-box" id="profile-box">
          <div class="empty">正在加载用户信息。</div>
        </div>
      </article>

      <article class="card span-8">
        <h2>订单概览</h2>
        <p class="lead">按标签切换不同类型的票据列表，模拟个人中心的分页面体验。</p>
        <div class="summary-grid" id="summary-grid">
          <div class="summary-item">
            <strong>0</strong>
            <span>购票历史</span>
          </div>
          <div class="summary-item">
            <strong>0</strong>
            <span>待出行</span>
          </div>
          <div class="summary-item">
            <strong>0</strong>
            <span>待付款</span>
          </div>
        </div>
        <div class="tab-bar" role="tablist" aria-label="订单分类">
          <button class="tab-button is-active" type="button" data-tab="history">购票历史</button>
          <button class="tab-button" type="button" data-tab="upcoming">待出行</button>
          <button class="tab-button" type="button" data-tab="pending">待付款</button>
        </div>
        <div class="ticket-list" id="ticket-list">
          <div class="empty">正在加载票据列表。</div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const TOKEN_KEY = "ticket_master_access_token";
    const token = localStorage.getItem(TOKEN_KEY);

    if (!token) {
      window.location.replace("/login");
    }

    const state = {
      token,
      user: null,
      tickets: [],
      activeTab: "history"
    };

    const el = {
      profileStatus: document.getElementById("profile-status"),
      profileBox: document.getElementById("profile-box"),
      summaryGrid: document.getElementById("summary-grid"),
      ticketList: document.getElementById("ticket-list"),
      refreshButton: document.getElementById("refresh-button"),
      goBookingButton: document.getElementById("go-booking-button"),
      logoutButton: document.getElementById("logout-button")
    };

    function clearSessionAndReturnHome() {
      localStorage.removeItem(TOKEN_KEY);
      window.location.replace("/login");
    }

    function setStatus(message, tone = "") {
      el.profileStatus.textContent = message;
      el.profileStatus.dataset.tone = tone;
    }

    async function request(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${state.token}`,
          ...(options.headers || {})
        }
      });

      const raw = await response.text();
      let data = null;

      if (raw) {
        try {
          data = JSON.parse(raw);
        } catch (error) {
          data = raw;
        }
      }

      if (response.status === 401) {
        clearSessionAndReturnHome();
        throw new Error("登录状态已失效，请重新登录");
      }

      if (!response.ok) {
        const message = typeof data === "object" && data && data.error ? data.error : `${response.status} ${response.statusText}`;
        throw new Error(message);
      }

      return data;
    }

    function formatTime(value) {
      if (!value) return "-";
      const date = new Date(value);
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function formatPrice(value) {
      return new Intl.NumberFormat("zh-CN", {
        style: "currency",
        currency: "CNY",
        maximumFractionDigits: 0
      }).format(value || 0);
    }

    function isUpcoming(ticket) {
      if (!ticket || ticket.status === "canceled") {
        return false;
      }

      if (!ticket.departure_time) {
        return false;
      }

      return new Date(ticket.departure_time).getTime() > Date.now();
    }

    function isPending(ticket) {
      return ticket && ticket.status === "reserved";
    }

    function filterTickets() {
      if (state.activeTab === "upcoming") {
        return state.tickets.filter(isUpcoming);
      }

      if (state.activeTab === "pending") {
        return state.tickets.filter(isPending);
      }

      return state.tickets;
    }

    function renderProfile() {
      if (!state.user) {
        el.profileBox.innerHTML = `<div class="empty">未加载到用户信息。</div>`;
        return;
      }

      el.profileBox.innerHTML = `
        <strong>${state.user.full_name || state.user.username}</strong>
        <div class="meta-list">
          <span>用户名：${state.user.username}</span>
          <span>创建时间：${formatTime(state.user.created_at)}</span>
          <span>最近改密：${formatTime(state.user.password_changed_at)}</span>
        </div>
        <div class="status">个人中心中的鉴权请求均使用当前登录后的 Bearer Token 发起，因此如果令牌失效，页面会自动回到登录入口。</div>
      `;
    }

    function renderSummary() {
      const historyCount = state.tickets.length;
      const upcomingCount = state.tickets.filter(isUpcoming).length;
      const pendingCount = state.tickets.filter(isPending).length;

      el.summaryGrid.innerHTML = `
        <div class="summary-item">
          <strong>${historyCount}</strong>
          <span>购票历史</span>
        </div>
        <div class="summary-item">
          <strong>${upcomingCount}</strong>
          <span>待出行</span>
        </div>
        <div class="summary-item">
          <strong>${pendingCount}</strong>
          <span>待付款</span>
        </div>
      `;
    }

    function renderTabs() {
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.tab === state.activeTab);
      });
    }

    function renderTickets() {
      const tickets = filterTickets();

      if (!tickets.length) {
        const emptyText = state.activeTab === "history"
          ? "当前还没有任何购票记录。"
          : state.activeTab === "upcoming"
            ? "当前没有待出行订单。"
            : "当前没有待付款订单。";

        el.ticketList.innerHTML = `<div class="empty">${emptyText}</div>`;
        return;
      }

      el.ticketList.innerHTML = tickets.map((ticket) => `
        <article class="ticket-card">
          <div class="ticket-top">
            <div>
              <strong>票据 #${ticket.ticket_id}</strong>
              <p>班次 ID：${ticket.bus_id}，座位：${ticket.seat_number}，状态：${ticket.status}</p>
            </div>
            <div class="pill">${ticket.status}</div>
          </div>
          <p>出发时间：${formatTime(ticket.departure_time)}</p>
          <p>到达时间：${formatTime(ticket.arrival_time)}</p>
          <p>下单时间：${formatTime(ticket.reserved_at)}</p>
          <p>票价：${formatPrice(ticket.price)}</p>
          <div class="ticket-actions">
            <button class="btn-ghost" type="button" data-action="go-booking">去购票页</button>
            <button class="btn-danger" type="button" data-action="cancel-ticket" data-ticket-id="${ticket.ticket_id}" ${ticket.status === "canceled" ? "disabled" : ""}>退票</button>
          </div>
        </article>
      `).join("");
    }

    async function loadProfile() {
      try {
        const data = await request("/user/info", { method: "GET" });
        state.user = data && data.user ? data.user : null;
        renderProfile();
      } catch (error) {
        state.user = null;
        renderProfile();
        throw error;
      }
    }

    async function loadTickets() {
      try {
        const tickets = await request("/user/tickets", { method: "GET" });
        state.tickets = tickets || [];
        renderSummary();
        renderTabs();
        renderTickets();
      } catch (error) {
        state.tickets = [];
        renderSummary();
        renderTabs();
        renderTickets();
        throw error;
      }
    }

    async function refreshAll() {
      try {
        await loadProfile();
        await loadTickets();
        setStatus("个人中心数据已刷新。", "success");
      } catch (error) {
        setStatus(`加载失败：${error.message}`, "error");
      }
    }

    async function cancelTicket(ticketId) {
      try {
        const result = await request(`/tickets/${ticketId}`, { method: "DELETE" });
        setStatus(result && result.message ? result.message : "退票成功。", "success");
        await loadTickets();
      } catch (error) {
        setStatus(`退票失败：${error.message}`, "error");
      }
    }

    document.addEventListener("click", async (event) => {
      const tabButton = event.target.closest(".tab-button");
      if (tabButton) {
        state.activeTab = tabButton.dataset.tab;
        renderTabs();
        renderTickets();
        return;
      }

      const actionButton = event.target.closest("button[data-action]");
      if (!actionButton) {
        return;
      }

      if (actionButton.dataset.action === "cancel-ticket") {
        await cancelTicket(actionButton.dataset.ticketId);
        return;
      }

      if (actionButton.dataset.action === "go-booking") {
        window.location.assign("/booking");
      }
    });

    el.refreshButton.addEventListener("click", refreshAll);
    el.goBookingButton.addEventListener("click", () => {
      window.location.assign("/booking");
    });
    el.logoutButton.addEventListener("click", clearSessionAndReturnHome);

    refreshAll();
  </script>
</body>
</html>
