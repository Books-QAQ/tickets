<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>票务系统 | 个人中心</title>
  <link rel="stylesheet" href="/assets/css/base.css?v=20260818-4">
  <link rel="stylesheet" href="/assets/css/profile.css?v=20260818-4">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-badge">TM</span>
        <span>智慧客运票务系统</span>
      </a>
      <div class="topbar-right">
        <nav class="nav-links" aria-label="主导航">
          <a href="/">首页</a>
          <a href="/booking">购票</a>
          <a class="is-primary" href="/profile">个人中心</a>
        </nav>
        <button class="btn-danger btn-sm" id="logout-button" type="button">退出登录</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <section class="page-head">
      <div class="page-head-copy">
        <div class="eyebrow">个人中心</div>
        <h1>我的账户与订单</h1>
        <p class="lead">统一查看账户资料、购票历史，以及待出行、待付款的订单记录。</p>
      </div>
      <div class="page-head-actions">
        <button class="btn-ghost" id="refresh-button" type="button">刷新数据</button>
        <button class="btn-primary" id="go-booking-button" type="button">继续购票</button>
      </div>
    </section>

    <div class="status" id="profile-status">正在加载个人资料与票据数据。</div>

    <section class="layout">
      <article class="card span-4">
        <h2>账户信息</h2>
        <p class="lead">当前登录账号的基础资料显示在这里。</p>
        <div class="profile-box" id="profile-box">
          <div class="empty">正在加载用户信息。</div>
        </div>
      </article>

      <article class="card span-8">
        <h2>订单概览</h2>
        <p class="lead">按标签切换购票历史、待出行与待付款订单，快速定位不同状态的票据。</p>
        <div class="summary-grid" id="summary-grid">
          <div class="summary-item">
            <strong>0</strong>
            <span>购票历史</span>
          </div>
          <div class="summary-item">
            <strong>0</strong>
            <span>待出行</span>
          </div>
          <div class="summary-item">
            <strong>0</strong>
            <span>待付款</span>
          </div>
        </div>
        <div class="tab-bar" role="tablist" aria-label="订单分类">
          <button class="tab-button is-active" type="button" data-tab="history">购票历史</button>
          <button class="tab-button" type="button" data-tab="upcoming">待出行</button>
          <button class="tab-button" type="button" data-tab="pending">待付款</button>
        </div>
        <div class="ticket-list" id="ticket-list">
          <div class="empty">正在加载票据列表。</div>
        </div>
      </article>
    </section>
  </main>

  <script>
    const TOKEN_KEY = "ticket_master_access_token";
    const token = localStorage.getItem(TOKEN_KEY);

    if (!token) {
      window.location.replace("/login");
    }

    const state = {
      token,
      user: null,
      tickets: [],
      activeTab: "history"
    };

    const el = {
      profileStatus: document.getElementById("profile-status"),
      profileBox: document.getElementById("profile-box"),
      summaryGrid: document.getElementById("summary-grid"),
      ticketList: document.getElementById("ticket-list"),
      refreshButton: document.getElementById("refresh-button"),
      goBookingButton: document.getElementById("go-booking-button"),
      logoutButton: document.getElementById("logout-button")
    };

    function clearSessionAndReturnHome() {
      localStorage.removeItem(TOKEN_KEY);
      window.location.replace("/login");
    }

    function setStatus(message, tone = "") {
      el.profileStatus.textContent = message;
      el.profileStatus.dataset.tone = tone;
    }

    async function request(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          Authorization: `Bearer ${state.token}`,
          ...(options.headers || {})
        }
      });

      const raw = await response.text();
      let data = null;

      if (raw) {
        try {
          data = JSON.parse(raw);
        } catch (error) {
          data = raw;
        }
      }

      if (response.status === 401) {
        clearSessionAndReturnHome();
        throw new Error("登录状态已失效，请重新登录");
      }

      if (!response.ok) {
        const message = typeof data === "object" && data && data.error ? data.error : `${response.status} ${response.statusText}`;
        throw new Error(message);
      }

      return data;
    }

    function formatTime(value) {
      if (!value) return "-";
      const date = new Date(value);
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function formatPrice(value) {
      return new Intl.NumberFormat("zh-CN", {
        style: "currency",
        currency: "CNY",
        maximumFractionDigits: 0
      }).format(value || 0);
    }

    function isUpcoming(ticket) {
      if (!ticket || ticket.status === "canceled") {
        return false;
      }

      if (!ticket.departure_time) {
        return false;
      }

      return new Date(ticket.departure_time).getTime() > Date.now();
    }

    function isPending(ticket) {
      return ticket && ticket.status === "reserved";
    }

    function filterTickets() {
      if (state.activeTab === "upcoming") {
        return state.tickets.filter(isUpcoming);
      }

      if (state.activeTab === "pending") {
        return state.tickets.filter(isPending);
      }

      return state.tickets;
    }

    function renderProfile() {
      if (!state.user) {
        el.profileBox.innerHTML = `<div class="empty">未加载到用户信息。</div>`;
        return;
      }

      el.profileBox.innerHTML = `
        <strong>${state.user.full_name || state.user.username}</strong>
        <div class="meta-list">
          <span>用户名：${state.user.username}</span>
          <span>创建时间：${formatTime(state.user.created_at)}</span>
          <span>最近改密：${formatTime(state.user.password_changed_at)}</span>
        </div>
      `;
    }

    function renderSummary() {
      const historyCount = state.tickets.length;
      const upcomingCount = state.tickets.filter(isUpcoming).length;
      const pendingCount = state.tickets.filter(isPending).length;

      el.summaryGrid.innerHTML = `
        <div class="summary-item">
          <strong>${historyCount}</strong>
          <span>购票历史</span>
        </div>
        <div class="summary-item">
          <strong>${upcomingCount}</strong>
          <span>待出行</span>
        </div>
        <div class="summary-item">
          <strong>${pendingCount}</strong>
          <span>待付款</span>
        </div>
      `;
    }

    function renderTabs() {
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.tab === state.activeTab);
      });
    }

    function renderTickets() {
      const tickets = filterTickets();

      if (!tickets.length) {
        const emptyText = state.activeTab === "history"
          ? "当前还没有任何购票记录。"
          : state.activeTab === "upcoming"
            ? "当前没有待出行订单。"
            : "当前没有待付款订单。";

        el.ticketList.innerHTML = `<div class="empty">${emptyText}</div>`;
        return;
      }

      el.ticketList.innerHTML = tickets.map((ticket) => `
        <article class="ticket-card">
          <div class="ticket-top">
            <div>
              <strong>票据 #${ticket.ticket_id}</strong>
              <p>班次 ID：${ticket.bus_id}，座位：${ticket.seat_number}，状态：${ticket.status}</p>
            </div>
            <div class="pill">${ticket.status}</div>
          </div>
          <p>出发时间：${formatTime(ticket.departure_time)}</p>
          <p>到达时间：${formatTime(ticket.arrival_time)}</p>
          <p>下单时间：${formatTime(ticket.reserved_at)}</p>
          <p>票价：${formatPrice(ticket.price)}</p>
          <div class="ticket-actions">
            <button class="btn-ghost" type="button" data-action="go-booking">去购票页</button>
            <button class="btn-danger" type="button" data-action="cancel-ticket" data-ticket-id="${ticket.ticket_id}" ${ticket.status === "canceled" ? "disabled" : ""}>退票</button>
          </div>
        </article>
      `).join("");
    }

    async function loadProfile() {
      try {
        const data = await request("/user/info", { method: "GET" });
        state.user = data && data.user ? data.user : null;
        renderProfile();
      } catch (error) {
        state.user = null;
        renderProfile();
        throw error;
      }
    }

    async function loadTickets() {
      try {
        const tickets = await request("/user/tickets", { method: "GET" });
        state.tickets = tickets || [];
        renderSummary();
        renderTabs();
        renderTickets();
      } catch (error) {
        state.tickets = [];
        renderSummary();
        renderTabs();
        renderTickets();
        throw error;
      }
    }

    async function refreshAll() {
      try {
        await loadProfile();
        await loadTickets();
        setStatus("个人中心数据已刷新。", "success");
      } catch (error) {
        setStatus(`加载失败：${error.message}`, "error");
      }
    }

    async function cancelTicket(ticketId) {
      try {
        const result = await request(`/tickets/${ticketId}`, { method: "DELETE" });
        setStatus(result && result.message ? result.message : "退票成功。", "success");
        await loadTickets();
      } catch (error) {
        setStatus(`退票失败：${error.message}`, "error");
      }
    }

    document.addEventListener("click", async (event) => {
      const tabButton = event.target.closest(".tab-button");
      if (tabButton) {
        state.activeTab = tabButton.dataset.tab;
        renderTabs();
        renderTickets();
        return;
      }

      const actionButton = event.target.closest("button[data-action]");
      if (!actionButton) {
        return;
      }

      if (actionButton.dataset.action === "cancel-ticket") {
        await cancelTicket(actionButton.dataset.ticketId);
        return;
      }

      if (actionButton.dataset.action === "go-booking") {
        window.location.assign("/booking");
      }
    });

    el.refreshButton.addEventListener("click", refreshAll);
    el.goBookingButton.addEventListener("click", () => {
      window.location.assign("/booking");
    });
    el.logoutButton.addEventListener("click", clearSessionAndReturnHome);

    refreshAll();
  </script>
</body>
</html>
